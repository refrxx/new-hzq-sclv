                            <p class="text-lg font-bold text-slate-900 dark:text-white">Refriansyah G</p>
                            <p class="text-2xl font-black text-brand-blue dark:text-brand-gold my-2 tracking-wider" id="bsi-acc">7215815115</p>
                            <button onclick="copyToClipboard('7215815115')" class="mt-2 bg-brand-blue dark:bg-brand-gold text-white dark:text-black font-bold py-2 px-5 rounded-xl text-sm hover:opacity-90 transition-all flex items-center gap-2">

                    <div class="flex">

                    </div>

                        <span class="text-slate-500 dark:text-slate-400 w-28 shrink-0">Kurir</span>

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            const btns = document.querySelectorAll('button');
            btns.forEach(b => {
                if (b.textContent.includes('Salin')) {
                    const orig = b.innerHTML;
                    b.innerHTML = '<span class="material-symbols-outlined text-lg">check</span> Tersalin!';
                    setTimeout(() => b.innerHTML = orig, 2000);
                }
            });
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        });
    }
